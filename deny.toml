# cargo-deny configuration.
# CI runs this; locally: .toolchain/bin/cargo-deny check

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal crates are path dependencies and are referenced via workspace = true.
allow-wildcard-paths = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "Unlicense",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
