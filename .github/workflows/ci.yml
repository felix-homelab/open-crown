name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2

      - name: Generated bindings are current
        run: |
          cargo build -p opencrown-ffi
          cargo run -q -p opencrown-ffi --bin uniffi-bindgen -- generate \
            --library target/debug/libopencrown.so \
            --language kotlin \
            --out-dir /tmp/generated \
            --no-format
          diff -ru ffi/generated /tmp/generated

  python:
    name: Python tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements.txt
      - run: PYTHONPATH=tools/lib python -m unittest discover -s tools/tests -v
      - name: Verify the committed example bundle
        run: python catalog/tooling/verify.py catalog/examples/signed
      - name: Verify the external futex-timer bundle
        run: python catalog/tooling/verify.py payloads/external/org.opencrown.payload.futex-timer
      - name: Validate the supported-device list
        run: python catalog/tooling/devices.py validate --list catalog/supported-devices.json
      - name: Validate the payload index
        run: python catalog/tooling/payload_index.py validate --index catalog/payload-index.json
      - name: Check Markdown links
        run: python tools/link-check/cli.py .

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;30.0.16248370"

      - name: Build the K2a probe
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" tools/hci-echo/build.sh
          file tools/hci-echo/hci-echo
      - uses: actions/upload-artifact@v4
        with:
          name: hci-echo
          path: tools/hci-echo/hci-echo

      - uses: dtolnay/rust-toolchain@stable
      - name: Build the Android FFI library
        run: |
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/30.0.16248370" tools/build-android-lib.sh

      # FfiRoundTripTest loads the host library, so build it first.
      - run: cargo build -p opencrown-ffi

      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      - name: APK report
        run: python3 tools/release/apk-report.py app/build/outputs/apk/debug/app-debug.apk --out apk-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: apk-report
          path: apk-report.json